$def with(datos)
<h1>Contactos</h1>
<a href="/insertar_contacto">Insertar</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
        </tr>
    </thead>
    <tbody>
        $for contacto in datos:
        <tr>
            <td>$contacto["id_contacto"]</td>
            <td>$contacto["nombre"]</td>
            <td>$contacto["email"]</td>
            <td>$contacto["telefono"]</td>
        </tr>
    </tbody>
</table>
