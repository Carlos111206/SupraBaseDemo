$def with(datos)
<h1>Contactos</h1>
<a href="/insertar_contacto">Insertar</a>

<table border="1">
    <thead>
        <tr>
            <th>Foto</th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Ver contacto</th>
            <th>Borrar</th>
            <th>Actualizar</th>
        </tr>
    </thead>
    <tbody>
        $for contacto in datos:
            <tr>
                 <td>
                    <img src="/static/images/default.png" alt="Foto" width="100" height="100">
                </td>
                <td>$contacto["id_contacto"]</td>
                <td>$contacto["nombre"]</td>
                <td>$contacto["email"]</td>
                <td>$contacto["telefono"]</td>
                <td><a href="/ver_contacto?id_contacto=$contacto['id_contacto']">ver</a></td>
                <td> <a href="/borrar_contacto?id_contacto=$contacto['id_contacto']">Borrar</a></td>
                <td> <a href="/actualizar_contacto?id_contacto=$contacto['id_contacto']">Actualizar</a></td>
        </tr>
    </tbody>
</table>
