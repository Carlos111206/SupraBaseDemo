$def with (contacto)
$if contacto:
    $ foto = contacto.get('foto') or 'default.png'
    <h1>Ver contacto</h1>
    <img src="/static/fotos/$foto" alt="Foto" width="150" height="150">
    <p>Nombre: $contacto['nombre']</p>
    <p>Email: $contacto['email']</p>
    <p>Teléfono: $contacto['telefono']</p>
    <a href="/lista_contactos">Regresar a la lista de contactos</a>
$else:
    <p>Contacto no encontrado</p>
    <a href="/lista_contactos">Regresar a la lista de contactos</a>
