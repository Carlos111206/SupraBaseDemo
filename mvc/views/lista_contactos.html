$def with (contactos)
<h1>Contactos</h1>
<nav>
<a href="/insertar_contacto">Insertar contacto</a>
<a href="/">Inicio</a>
<a href="/cerrar_sesion">Cerrar sesión</a>
</nav>
<table border="1">
<thead>
<tr><th>Foto</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Acciones</th></tr>
</thead>
<tbody>
$for contacto in contactos:
    $ foto = contacto.get('foto') or 'default.png'
    <tr>
    <td><img src="/static/fotos/$foto" alt="Foto" width="80" height="80"></td>
    <td>$contacto['nombre']</td>
    <td>$contacto['email']</td>
    <td>$contacto['telefono']</td>
    <td>
    <a href="/ver_contacto?id_contacto=$contacto['id_contacto']">Ver</a>
    <a href="/actualizar_contacto?id_contacto=$contacto['id_contacto']">Actualizar</a>
    <a href="/borrar_contacto?id_contacto=$contacto['id_contacto']">Borrar</a>
    </td>
    </tr>
</tbody>
</table>
