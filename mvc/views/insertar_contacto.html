$def with (mensaje)
<h1>Insertar contacto</h1>
$if mensaje:
    <p>$mensaje</p>
<form method="post" action="/insertar_contacto" enctype="multipart/form-data">
<p><label for="nombre">Nombre</label><br>
<input type="text" name="nombre" id="nombre" required></p>
<p><label for="email">Email</label><br>
<input type="email" name="email" id="email" required></p>
<p><label for="telefono">Teléfono</label><br>
<input type="tel" name="telefono" id="telefono" required></p>
<p><label for="foto">Foto (.jpg, .jpeg, .png o .webp)</label><br>
<input type="file" name="foto" id="foto" accept=".jpg,.jpeg,.png,.webp"></p>
<button type="submit">Insertar</button>
<a href="/lista_contactos">Cancelar</a>
</form>
