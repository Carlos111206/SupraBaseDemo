<form name="contactos" method="post" ectype="multipart/form-data">
    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre" required>

    <label for="email">Email</label>
    <input type="email" name="email" id="email" required>

    <label for="telefono">Telefono</label>
    <input type="tel" name="telefono" id="telefono" required>

    <label for="image">Foto del Perfil</label>
    <input type="file" name="image" accept=".png" required><br>

    <button type="submit" name="guardar" id="guardar">guardar</button>
    <button type="reset" name="limpiar" id="limpiar">limpiar</button>

</form>
