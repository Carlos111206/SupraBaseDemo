$def with (contacto, mensaje)
$if contacto:
    $ foto = contacto.get('foto') or 'default.png'
    <h1>Actualizar contacto</h1>
    $if mensaje:
        <p>$mensaje</p>
    <form method="post" action="/actualizar_contacto" enctype="multipart/form-data">
    <input type="hidden" name="id_contacto" value="$contacto['id_contacto']">
    <img src="/static/fotos/$foto" alt="Foto" width="150" height="150">
    <p><label for="nombre">Nombre</label><br>
    <input type="text" name="nombre" id="nombre" value="$contacto['nombre']" required></p>
    <p><label for="email">Email</label><br>
    <input type="email" name="email" id="email" value="$contacto['email']" required></p>
    <p><label for="telefono">Teléfono</label><br>
    <input type="tel" name="telefono" id="telefono" value="$contacto['telefono']" required></p>
    <p><label for="foto">Cambiar foto (opcional)</label><br>
    <input type="file" name="foto" id="foto" accept=".jpg,.jpeg,.png,.webp"></p>
    <button type="submit">Actualizar</button>
    <a href="/lista_contactos">Cancelar</a>
    </form>
$else:
    <p>Contacto no encontrado</p>
    <a href="/lista_contactos">Regresar a la lista de contactos</a>
