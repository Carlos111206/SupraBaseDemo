$def with (contacto)

$ imagen = contacto.get('imagen') or 'default.png'

<h1>Actualizar contacto</h1>

<form name="actualizar" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id_contacto" value="$contacto['id_contacto']">

    <img src="/static/images/$imagen" alt="Foto" width="100" height="100"><br>

    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre" value="$contacto['nombre']" required><br>

    <label for="email">Email</label>
    <input type="email" name="email" id="email" value="$contacto['email']" required><br>

    <label for="telefono">Telefono</label>
    <input type="tel" name="telefono" id="telefono" value="$contacto['telefono']" required><br>

    <label for="image">Cambiar foto (opcional)</label>
    <input type="file" name="image" id="image" accept=".png,.jpg,.jpeg"><br>

    <button type="submit">Guardar cambios</button>
</form>

<a href="/contactos">Regresar</a>
